<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="border-bottom:1px solid #d6e2db;background:rgba(248,250,249,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)">
  <div style="margin:0 auto;max-width:1280px;padding:0 {{ hdrPad }}px;display:flex;height:80px;align-items:center;justify-content:space-between;gap:12px">
    <a href="Home.dc.html" onMouseEnter="{{ logoH.enter }}" onMouseLeave="{{ logoH.leave }}" style="display:flex;align-items:center;gap:12px;flex-shrink:0">
      <img src="public/favicon.png" alt="Top Line Glass Products Accessories" width="108" height="56" style="height:56px;width:auto;transition:transform 150ms cubic-bezier(0.4,0,0.2,1);transform:{{ logoScale }}">
      <sc-if value="{{ xl }}" hint-placeholder-val="{{ true }}">
        <div style="line-height:1.25">
          <div style="font-size:13px;font-weight:600;letter-spacing:-0.025em">Top Line Glass Products Accessories</div>
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.18em;color:#4a5b52">Manufacturer · Riyadh</div>
        </div>
      </sc-if>
    </a>

    <sc-if value="{{ lg }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:2px">
        <div style="position:relative"><a href="About.dc.html" style="display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:8px 10px;font-size:13px;font-weight:500;color:{{ nav.about }};transition:color 150ms cubic-bezier(0.4,0,0.2,1);white-space:nowrap" style-hover="color:#0f2a1c">About Us</a></div>
        <div style="position:relative" onMouseEnter="{{ navH.enter }}" onMouseLeave="{{ navH.leave }}">
          <a href="Products.dc.html" style="display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:8px 10px;font-size:13px;font-weight:500;color:{{ nav.products }};transition:color 150ms cubic-bezier(0.4,0,0.2,1);white-space:nowrap" style-hover="color:#0f2a1c">Products
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:14px;width:14px;opacity:0.6"><path d="m6 9 6 6 6-6"></path></svg>
          </a>
          <div style="position:fixed;left:50%;top:80px;width:min(920px, calc(100vw - 2rem));padding:0 8px;translate:-50% {{ ddY }};visibility:{{ ddVis }};opacity:{{ ddOp }};transition:all 200ms cubic-bezier(0.4,0,0.2,1)">
            <div style="border-radius:12px;border:1px solid #d6e2db;background:#ffffff;box-shadow:0 10px 30px -10px rgb(15 23 42 / 0.25);padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-height:70vh;overflow-y:auto">
              <sc-for list="{{ cats }}" as="c" hint-placeholder-count="1">
                <a href="{{ c.href }}" style="display:flex;align-items:center;gap:12px;border-radius:6px;padding:8px 10px;font-size:14px;line-height:20px;transition:background-color 150ms cubic-bezier(0.4,0,0.2,1)" style-hover="background-color:#dbe9e0">
                  <span style="display:grid;height:36px;width:36px;flex-shrink:0;place-items:center;border-radius:6px;background:#006c35;color:#f8faf9;font-size:14px;line-height:20px;font-weight:700">{{ c.n }}</span>
                  <span style="line-height:1.25">{{ c.name }}</span>
                </a>
              </sc-for>
            </div>
          </div>
        </div>
        <div style="position:relative"><a href="Catalogues.dc.html" style="display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:8px 10px;font-size:13px;font-weight:500;color:{{ nav.catalogues }};transition:color 150ms cubic-bezier(0.4,0,0.2,1);white-space:nowrap" style-hover="color:#0f2a1c">Catalogues</a></div>
        <div style="position:relative"><a href="Projects.dc.html" style="display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:8px 10px;font-size:13px;font-weight:500;color:{{ nav.projects }};transition:color 150ms cubic-bezier(0.4,0,0.2,1);white-space:nowrap" style-hover="color:#0f2a1c">Projects</a></div>
        <div style="position:relative"><a href="Contact.dc.html" style="display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:8px 10px;font-size:13px;font-weight:500;color:{{ nav.contact }};transition:color 150ms cubic-bezier(0.4,0,0.2,1);white-space:nowrap" style-hover="color:#0f2a1c">Contact Us</a></div>
      </nav>
    </sc-if>

    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
      <sc-if value="{{ sm }}" hint-placeholder-val="{{ true }}">
        <a href="{{ wa }}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:8px;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;color:#ffffff;background-color:#25D366;box-shadow:0 1px 2px rgb(15 23 42 / 0.04), 0 8px 24px -8px rgb(15 23 42 / 0.08);transition:transform 300ms ease, box-shadow 300ms ease" style-hover="transform:translateY(-4px);box-shadow:0 10px 30px -10px rgb(15 23 42 / 0.25)">
          <svg viewBox="0 0 32 32" fill="currentColor" style="height:16px;width:16px"><path d="M16 .396C7.164.396 0 7.560 0 16.396c0 2.832.744 5.6 2.164 8.020L.060 32l7.828-2.052A15.94 15.94 0 0 0 16 32.396c8.836 0 16-7.164 16-16s-7.164-16-16-16zm0 29.204a13.19 13.19 0 0 1-6.73-1.844l-.48-.288-4.652 1.220 1.240-4.532-.312-.468a13.14 13.14 0 0 1-2.020-7.088c0-7.280 5.924-13.204 13.208-13.204 3.528 0 6.844 1.376 9.340 3.876a13.11 13.11 0 0 1 3.868 9.336c-.004 7.280-5.928 13.204-13.208 13.204zm7.264-9.884c-.396-.2-2.348-1.160-2.712-1.292-.364-.132-.628-.2-.892.2s-1.024 1.292-1.256 1.556c-.232.264-.464.296-.86.1-.396-.2-1.676-.616-3.192-1.964-1.180-1.052-1.976-2.352-2.208-2.748-.232-.396-.024-.612.176-.808.18-.176.396-.464.596-.696.2-.232.264-.396.396-.66.132-.264.068-.496-.032-.696s-.892-2.152-1.224-2.948c-.324-.776-.652-.668-.892-.68-.232-.012-.496-.016-.76-.016s-.696.1-1.060.496-1.392 1.360-1.392 3.316 1.424 3.848 1.624 4.112c.2.264 2.804 4.284 6.792 6.008.948.408 1.688.652 2.264.836.952.304 1.816.26 2.5.16.764-.116 2.348-.96 2.680-1.888.332-.928.332-1.724.232-1.888-.1-.164-.364-.264-.76-.464z"></path></svg>
          Send Enquiry
        </a>
      </sc-if>
      <sc-if value="{{ notLg }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ toggleMenu }}" aria-label="Toggle menu" style="display:inline-flex;height:36px;width:36px;align-items:center;justify-content:center;border-radius:6px;border:1px solid #d6e2db">
          <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:16px;width:16px"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
          </sc-if>
          <sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="height:16px;width:16px"><path d="M4 12h16"></path><path d="M4 6h16"></path><path d="M4 18h16"></path></svg>
          </sc-if>
        </button>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{ showMobileMenu }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid #d6e2db;background:#f8faf9">
      <div style="max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;flex-direction:column">
        <a href="About.dc.html" onClick="{{ closeMenu }}" style="padding:8px 0;font-size:14px;line-height:20px;font-weight:500">About Us</a>
        <a href="Products.dc.html" onClick="{{ closeMenu }}" style="padding:8px 0;font-size:14px;line-height:20px;font-weight:500">Products</a>
        <a href="Catalogues.dc.html" onClick="{{ closeMenu }}" style="padding:8px 0;font-size:14px;line-height:20px;font-weight:500">Catalogues</a>
        <a href="Projects.dc.html" onClick="{{ closeMenu }}" style="padding:8px 0;font-size:14px;line-height:20px;font-weight:500">Projects</a>
        <a href="Contact.dc.html" onClick="{{ closeMenu }}" style="padding:8px 0;font-size:14px;line-height:20px;font-weight:500">Contact Us</a>
        <a href="{{ wa }}" target="_blank" rel="noopener noreferrer" style="margin-top:8px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;padding:8px 16px;font-size:14px;line-height:20px;font-weight:600;color:#ffffff;background-color:#25D366">
          <svg viewBox="0 0 32 32" fill="currentColor" style="height:16px;width:16px"><path d="M16 .396C7.164.396 0 7.560 0 16.396c0 2.832.744 5.6 2.164 8.020L.060 32l7.828-2.052A15.94 15.94 0 0 0 16 32.396c8.836 0 16-7.164 16-16s-7.164-16-16-16zm0 29.204a13.19 13.19 0 0 1-6.73-1.844l-.48-.288-4.652 1.220 1.240-4.532-.312-.468a13.14 13.14 0 0 1-2.020-7.088c0-7.280 5.924-13.204 13.208-13.204 3.528 0 6.844 1.376 9.340 3.876a13.11 13.11 0 0 1 3.868 9.336c-.004 7.280-5.928 13.204-13.208 13.204zm7.264-9.884c-.396-.2-2.348-1.160-2.712-1.292-.364-.132-.628-.2-.892.2s-1.024 1.292-1.256 1.556c-.232.264-.464.296-.86.1-.396-.2-1.676-.616-3.192-1.964-1.180-1.052-1.976-2.352-2.208-2.748-.232-.396-.024-.612.176-.808.18-.176.396-.464.596-.696.2-.232.264-.396.396-.66.132-.264.068-.496-.032-.696s-.892-2.152-1.224-2.948c-.324-.776-.652-.668-.892-.68-.232-.012-.496-.016-.76-.016s-.696.1-1.060.496-1.392 1.360-1.392 3.316 1.424 3.848 1.624 4.112c.2.264 2.804 4.284 6.792 6.008.948.408 1.688.652 2.264.836.952.304 1.816.26 2.5.16.764-.116 2.348-.96 2.680-1.888.332-.928.332-1.724.232-1.888-.1-.164-.364-.264-.76-.464z"></path></svg>
          Send Enquiry
        </a>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","about","products","catalogues","projects","contact"],"default":"home","tsType":"string"}}'>
const slugify = (c) => c.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const WA = "https://wa.me/966564508627?text=" + encodeURIComponent("Hi, I would like to send an enquiry about Top Line Glass Products Accessories.");
class Component extends DCLogic {
  state = { w: window.innerWidth, open: false, hov: null, cats: [] };
  hc = {};
  componentDidMount() { fetch("src/data/products.json").then((r) => r.json()).then((d) => this.setState({ cats: d.categories })); this.onResize = () => this.setState({ w: window.innerWidth }); window.addEventListener("resize", this.onResize); }
  componentWillUnmount() { window.removeEventListener("resize", this.onResize); }
  h(key) {
    if (!this.hc[key]) this.hc[key] = { enter: () => this.setState({ hov: key }), leave: () => this.setState((s) => (s.hov === key ? { hov: null } : null)) };
    return this.hc[key];
  }
  renderVals() {
    const { w, open, hov } = this.state;
    const sm = w >= 640, lg = w >= 1024, xl = w >= 1280;
    const active = this.props.active ?? "home";
    const nav = {};
    ["about","products","catalogues","projects","contact"].forEach((k) => { nav[k] = active === k ? "#0f2a1c" : "rgba(15,42,28,0.8)"; });
    return {
      wa: WA, sm, lg, xl, notLg: !lg, open, closed: !open, showMobileMenu: open && !lg, nav,
      hdrPad: lg ? 16 : 12,
      logoH: this.h("logo"), logoScale: hov === "logo" ? "scale(1.05)" : "none",
      navH: this.h("nav"),
      ddVis: hov === "nav" ? "visible" : "hidden", ddOp: hov === "nav" ? 1 : 0, ddY: hov === "nav" ? "0" : "4px",
      toggleMenu: () => this.setState((s) => ({ open: !s.open })),
      closeMenu: () => this.setState({ open: false }),
      cats: this.state.cats.map((c, i) => ({ name: c.name, n: i + 1, href: "Products.dc.html?c=" + c.slug })),
    };
  }
}
</script>
</body>
</html>
